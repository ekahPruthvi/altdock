[package]
name = "altdock"
version = "1.1.11"
edition = "2024"
authors = ["ekahPruthvi <ekahpdp@gmail.com>"]
description = "cynageos shell"
license = "GPL-3.0"
repository = "https://github.com/ekahPruthvi/altdock.git"

[dependencies]
gtk4 = "0.9.6"
gtk4-layer-shell = "0.5.0"
gdk4 = { version = "0.9.6", features = ["v4_8"] }
niri-ipc = "26.4.0"
system-tray = "0.8.7"
serde_json = "1.0.151"
libc = "0.2.186"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
self_update = "1.3.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
